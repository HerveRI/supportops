[project]
name = "supportops-backend"
version = "0.1.0"
description = "FastAPI backend for SupportOps"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "email-validator>=2.3.0",
    "fastapi",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]
